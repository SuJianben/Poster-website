<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Custom CSS four-rail frame visual check</title>
    <link rel="stylesheet" href="../../assets/custom-css-framing.css">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #222; background: #dedede; font-family: Arial, sans-serif; }
      .test-grid { display: grid; grid-template-columns: repeat(2, 520px); gap: 24px; padding: 30px; }
      .test-case { padding: 14px; background: #f7f7f7; }
      .test-case h2 { margin: 0 0 10px; font-size: 16px; }
      .ps-section { position: relative; width: 492px; height: 390px; background: #ecebea; }
      .ps-css-artwork { background: linear-gradient(135deg, #173c59, #d79264) !important; }
      .ps-css-artwork::after { position: absolute; inset: 25%; border-radius: 50%; background: linear-gradient(135deg, #f4c86b, #6da6c8); content: ''; }
      .test-case--dark .ps-css-artwork { background: linear-gradient(135deg, #8c5b42, #e5c8a1) !important; }
    </style>
  </head>
  <body>
    <main class="test-grid">
      <section class="test-case">
        <h2>Wood · four fallback textures</h2>
        <div class="ps-section" data-ps-framing-render-mode="css">
          <div class="ps-css-frame" data-has-frame="true" data-frame-material="wood" style="--ps-css-frame-width: 14px; --ps-css-frame-color: #a77b49; --ps-css-mat-box-width: 400px; --ps-css-mat-box-height: 300px;">
            <div class="ps-css-mat" data-has-mat="false" style="--ps-css-mat-width: 0;">
              <span class="ps-css-frame__rail ps-css-frame__rail--top" data-ps-css-frame-rail="top"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--right" data-ps-css-frame-rail="right"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--bottom" data-ps-css-frame-rail="bottom"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--left" data-ps-css-frame-rail="left"></span>
              <div class="ps-css-artwork"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="test-case test-case--dark">
        <h2>Aluminium · directional lighting</h2>
        <div class="ps-section" data-ps-framing-render-mode="css">
          <div class="ps-css-frame" data-has-frame="true" data-frame-material="alu" style="--ps-css-frame-width: 14px; --ps-css-frame-color: #171717; --ps-css-mat-box-width: 400px; --ps-css-mat-box-height: 300px;">
            <div class="ps-css-mat" data-has-mat="false" style="--ps-css-mat-width: 0;">
              <span class="ps-css-frame__rail ps-css-frame__rail--top" data-ps-css-frame-rail="top"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--right" data-ps-css-frame-rail="right"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--bottom" data-ps-css-frame-rail="bottom"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--left" data-ps-css-frame-rail="left"></span>
              <div class="ps-css-artwork"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="test-case">
        <h2>Wood · passepartout</h2>
        <div class="ps-section" data-ps-framing-render-mode="css">
          <div class="ps-css-frame" data-has-frame="true" data-frame-material="wood" style="--ps-css-frame-width: 14px; --ps-css-frame-color: #a77b49; --ps-css-mat-box-width: 400px; --ps-css-mat-box-height: 300px;">
            <div class="ps-css-mat" data-has-mat="true" style="--ps-css-mat-width: 34px; --ps-css-mat-color: #f6f2e8;">
              <span class="ps-css-frame__rail ps-css-frame__rail--top" data-ps-css-frame-rail="top"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--right" data-ps-css-frame-rail="right"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--bottom" data-ps-css-frame-rail="bottom"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--left" data-ps-css-frame-rail="left"></span>
              <div class="ps-css-artwork"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="test-case">
        <h2>Independent texture hooks</h2>
        <div class="ps-section" data-ps-framing-render-mode="css">
          <div class="ps-css-frame" data-has-frame="true" data-frame-material="wood" style="--ps-css-frame-width: 14px; --ps-css-frame-color: #7d664c; --ps-css-mat-box-width: 400px; --ps-css-mat-box-height: 300px; --ps-css-frame-texture-top: linear-gradient(90deg, #744 0 25%, #b77 25% 50%, #744 50% 75%, #b77 75%); --ps-css-frame-texture-right: linear-gradient(180deg, #335 0 25%, #779 25% 50%, #335 50% 75%, #779 75%); --ps-css-frame-texture-bottom: linear-gradient(90deg, #363 0 25%, #797 25% 50%, #363 50% 75%, #797 75%); --ps-css-frame-texture-left: linear-gradient(180deg, #624 0 25%, #a68 25% 50%, #624 50% 75%, #a68 75%);">
            <div class="ps-css-mat" data-has-mat="false" style="--ps-css-mat-width: 0;">
              <span class="ps-css-frame__rail ps-css-frame__rail--top" data-ps-css-frame-rail="top"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--right" data-ps-css-frame-rail="right"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--bottom" data-ps-css-frame-rail="bottom"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--left" data-ps-css-frame-rail="left"></span>
              <div class="ps-css-artwork"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="test-case">
        <h2>No frame regression</h2>
        <div class="ps-section" data-ps-framing-render-mode="css">
          <div class="ps-css-frame" data-has-frame="false" data-frame-material="wood" style="--ps-css-frame-width: 0; --ps-css-mat-box-width: 400px; --ps-css-mat-box-height: 300px;">
            <div class="ps-css-mat" data-has-mat="false">
              <span class="ps-css-frame__rail ps-css-frame__rail--top" data-ps-css-frame-rail="top"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--right" data-ps-css-frame-rail="right"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--bottom" data-ps-css-frame-rail="bottom"></span>
              <span class="ps-css-frame__rail ps-css-frame__rail--left" data-ps-css-frame-rail="left"></span>
              <div class="ps-css-artwork"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
